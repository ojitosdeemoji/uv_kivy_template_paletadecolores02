name: Build APK (con reintentos automáticos)

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y zip unzip openjdk-17-jdk wget

      - name: Set up Android SDK
        run: |
          mkdir -p $HOME/.android/sdk
          cd $HOME/.android/sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          rm cmdline-tools.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/* cmdline-tools/latest/ || true
          yes | $HOME/.android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1
          $HOME/.android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-30" "build-tools;30.0.3" > /dev/null 2>&1

      - name: Set environment variables
        run: |
          echo "ANDROID_HOME=$HOME/.android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/.android/sdk" >> $GITHUB_ENV
          echo "PATH=$PATH:$HOME/.android/sdk/cmdline-tools/latest/bin:$HOME/.android/sdk/platform-tools:$HOME/.android/sdk/build-tools/30.0.3" >> $GITHUB_ENV

      - name: Install Buildozer
        run: |
          pip install buildozer

      - name: Build APK (con reintentos automáticos de NDK)
        run: |
          # Lista de versiones de NDK a probar (de más estable a menos)
          NDK_VERSIONS="26d 27c 28c 25b"
          
          for NDK in $NDK_VERSIONS; do
            echo "🔄 Probando con NDK $NDK..."
            
            # Modificar temporalmente buildozer.spec para usar este NDK
            sed -i "s/^android.ndk = .*/android.ndk = $NDK/" buildozer.spec
            
            # Intentar compilar
            if buildozer -v android debug; then
              echo "✅ ¡COMPILACIÓN EXITOSA con NDK $NDK!"
              exit 0
            else
              echo "❌ Falló con NDK $NDK. Probando siguiente..."
            fi
          done
          
          # Si llegamos aquí, todas fallaron
          echo "❌ Todas las versiones de NDK fallaron."
          exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: palette_analyzer
          path: ./bin/*.apk
